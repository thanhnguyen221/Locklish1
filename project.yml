name: Locklish
options:
  bundleIdPrefix: com.locklish
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  Personal: debug
targets:
  Locklish:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Utilities
      - path: Extensions
      - path: Resources
      - path: Shared
    dependencies:
      - target: LocklishWidget
    info:
      path: Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSMicrophoneUsageDescription: "Locklish dùng micro để luyện phát âm: bạn đọc từ/câu và app chấm điểm tương đồng."
        NSSpeechRecognitionUsageDescription: "Locklish dùng nhận diện giọng nói để so sánh phần bạn đọc với từ vựng gốc."
    # Entitlements set per-configuration in settings below (XcodeGen's
    # entitlements.path would clobber per-config values):
    #   Debug/Release (paid account, simulator): full iCloud + Push + App Group
    #   Personal (free account, real device): empty — free teams cannot
    #   provision those capabilities; app falls back to local-only mode.
    settings:
      base:
        PRODUCT_NAME: Locklish
        PRODUCT_BUNDLE_IDENTIFIER: com.locklish.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        ENTITLEMENTS_REQUIRED: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_ENTITLEMENTS: Locklish-Personal.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Locklish.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Locklish.entitlements
        Personal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PERSONAL_BUILD"

  LocklishWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Locklish Ôn tập
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widget-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LocklishWidgetBundle
    settings:
      base:
        PRODUCT_NAME: LocklishWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.locklish.app.widget
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENTITLEMENTS_REQUIRED: YES
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: LocklishWidget-Personal.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: LocklishWidget.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: LocklishWidget.entitlements

schemes:
  Locklish:
    build:
      targets:
        Locklish: all
  Locklish-Personal:
    build:
      targets:
        Locklish: all
    run:
      config: Personal
    archive:
      config: Personal
